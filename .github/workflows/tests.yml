# Unit tests and browser end-to-end tests on every push and pull request.
# The browser tests run against a fake YNAB with made-up statements: no secrets,
# no real budget, token or statement is needed.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 3.13: Playwright's greenlet dependency may not have wheels for newer Pythons yet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          REQUIRE_E2E: "1"  # a missing Playwright / Chromium fails instead of skipping
          FLASK_SECRET_KEY: test
        run: python -m unittest discover tests -v

      # Screenshots and Playwright traces of failed browser tests
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.3  # same version as requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
